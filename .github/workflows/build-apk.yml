name: Build Android Release APK & AAB

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-android:
    name: Build Signed APK and AAB
    runs-on: ubuntu-latest

    steps:
      - name: 1. Checkout Repository Source Code
        uses: actions/checkout@v4

      - name: 2. Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: 3. Install Dependencies & Build Web Game Assets
        run: |
          npm install --legacy-peer-deps
          npm run build
          mkdir -p app/src/main/assets
          if [ -d "dist" ]; then
            cp -r dist/* app/src/main/assets/
          fi

      - name: 4. Set up Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: 5. Set up Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: 6. Setup Gradle Wrapper & Accept Licenses
        run: |
          yes | sdkmanager --licenses || true
          gradle wrapper --gradle-version 7.5.1
          chmod +x gradlew

      - name: 7. Generate Production Keystore (Automated Fallback)
        run: |
          mkdir -p app
          if [ -n "${{ secrets.KEYSTORE_BASE64 }}" ]; then
            echo "Using user-defined GitHub Secret Keystore..."
            echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 --decode > app/release.keystore
            echo "KEYSTORE_PASSWORD=${{ secrets.KEYSTORE_PASSWORD }}" >> $GITHUB_ENV
            echo "KEY_ALIAS=${{ secrets.KEY_ALIAS }}" >> $GITHUB_ENV
            echo "KEY_PASSWORD=${{ secrets.KEY_PASSWORD }}" >> $GITHUB_ENV
          else
            echo "Auto-generating release keystore for Cafe Bazaar & Myket..."
            keytool -genkeypair -v \
              -keystore app/release.keystore \
              -alias worldplay \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000 \
              -storetype PKCS12 \
              -storepass worldplay123 \
              -keypass worldplay123 \
              -dname "CN=Worldplay, OU=Mobile, O=WorldplayGame, L=Tehran, ST=Tehran, C=IR"
            echo "KEYSTORE_PASSWORD=worldplay123" >> $GITHUB_ENV
            echo "KEY_ALIAS=worldplay" >> $GITHUB_ENV
            echo "KEY_PASSWORD=worldplay123" >> $GITHUB_ENV
          fi
          echo "KEYSTORE_PATH=release.keystore" >> $GITHUB_ENV

      - name: 8. Build Signed Release APK
        run: ./gradlew assembleRelease --stacktrace

      - name: 9. Build Signed Release AAB (Google Play / Bazaar Bundle)
        run: ./gradlew bundleRelease --stacktrace

      - name: 10. Locate Artifact Files
        id: find_files
        run: |
          APK_FILE=$(find app/build/outputs/apk/release -name "*.apk" | head -n 1)
          AAB_FILE=$(find app/build/outputs/bundle/release -name "*.aab" | head -n 1)
          echo "Found APK: $APK_FILE"
          echo "Found AAB: $AAB_FILE"
          echo "apk_path=$APK_FILE" >> $GITHUB_OUTPUT
          echo "aab_path=$AAB_FILE" >> $GITHUB_OUTPUT

      - name: 11. Upload Release APK Artifact
        uses: actions/upload-artifact@v4
        if: steps.find_files.outputs.apk_path != ''
        with:
          name: Worldplay-Release-APK
          path: ${{ steps.find_files.outputs.apk_path }}
          retention-days: 30

      - name: 12. Upload Release AAB (Bundle) Artifact
        uses: actions/upload-artifact@v4
        if: steps.find_files.outputs.aab_path != ''
        with:
          name: Worldplay-Release-AAB
          path: ${{ steps.find_files.outputs.aab_path }}
          retention-days: 30

      - name: 13. Create Automatic GitHub Release (Direct Download APK & AAB)
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/') || github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'
        with:
          tag_name: v1.4.0-release
          name: "Worldplay Chess v1.4.0 - Android Release (APK & AAB)"
          body: |
            ## 👑 Worldplay Chess - همجهان شطرنج
            ### اولین بازی اقتباس شده از شطرنج با تم اساطیری و کیمیاگری
            - 📦 **Direct APK:** نسخه امضاشده نهایی برای نصب مستقیم روی گوشی‌ها، کافه بازار و مایکت
            - 🎯 **Google Play AAB:** فایل رسمی App Bundle برای انتشار در مارکت‌ها
            - 🛡️ **امضای دیجیتال:** امضای دوگانه V1 (JAR) و V2 (Full APK Signature) مخصوص قوانین کافه بازار و مایکت
          files: |
            ${{ steps.find_files.outputs.apk_path }}
            ${{ steps.find_files.outputs.aab_path }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        continue-on-error: true

plugins {
    id 'com.android.application'
}

android {
    namespace 'com.worldplay.game'
    compileSdk 33

    defaultConfig {
        applicationId "com.worldplay.game"
        minSdk 21
        targetSdk 33
        versionCode 1
        versionName "1.4.0"
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
    }

    signingConfigs {
        release {
            def kPath = System.getenv("KEYSTORE_PATH") ?: "release.keystore"
            def keystoreFile = file(kPath)
            if (!keystoreFile.exists()) {
                keystoreFile = file("${rootDir}/${kPath}")
            }
            if (!keystoreFile.exists()) {
                keystoreFile = file("${projectDir}/${kPath}")
            }
            if (keystoreFile.exists()) {
                storeFile keystoreFile
                storePassword System.getenv("KEYSTORE_PASSWORD") ?: "worldplay123"
                keyAlias System.getenv("KEY_ALIAS") ?: "worldplay"
                keyPassword System.getenv("KEY_PASSWORD") ?: "worldplay123"
            }
            v1SigningEnabled true
            v2SigningEnabled true
        }
    }

    buildTypes {
        release {
            signingConfig signingConfigs.release
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
        debug {
            applicationIdSuffix ".debug"
            debuggable true
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }

    bundle {
        language {
            enableSplit = false
        }
        density {
            enableSplit = true
        }
        abi {
            enableSplit = true
        }
    }
}

dependencies {
    // Zero heavy external dependencies required; native Android WebView with modern hardware acceleration
}

plugins {
    id 'com.android.application'
}

android {
    namespace 'com.worldplay.game'
    compileSdk 34

    defaultConfig {
        applicationId "com.worldplay.game"
        minSdk 21
        targetSdk 34
        versionCode 2
        versionName "1.4.1"
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
    }

    signingConfigs {
        release {
            def keystoreFile = file("release.keystore")
            if (!keystoreFile.exists()) {
                keystoreFile = file("${projectDir}/release.keystore")
            }
            if (!keystoreFile.exists()) {
                keystoreFile = file("${rootDir}/app/release.keystore")
            }
            if (!keystoreFile.exists()) {
                keystoreFile = file("${rootDir}/release.keystore")
            }
            if (keystoreFile.exists()) {
                storeFile keystoreFile
                storePassword System.getenv("KEYSTORE_PASSWORD") ?: "worldplay123"
                keyAlias System.getenv("KEY_ALIAS") ?: "worldplay"
                keyPassword System.getenv("KEY_PASSWORD") ?: "worldplay123"
            }
            v1SigningEnabled true
            v2SigningEnabled true
        }
    }

    buildTypes {
        release {
            def relKeystore = signingConfigs.release.storeFile
            if (relKeystore != null && relKeystore.exists()) {
                signingConfig signingConfigs.release
            } else {
                signingConfig signingConfigs.debug
            }
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
        debug {
            applicationIdSuffix ".debug"
            debuggable true
            signingConfig signingConfigs.debug
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    bundle {
        language {
            enableSplit = false
        }
        density {
            enableSplit = true
        }
        abi {
            enableSplit = true
        }
    }
}

dependencies {
    // Zero bloated native dependencies - pure native Android WebView with hardware acceleration
}
